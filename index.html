<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>技能高考备考</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#00A0E9;--blue-soft:#e8f6fd;--green:#22c55e;--green-soft:#eafaf1;--red:#ef4444;--red-soft:#fef2f2;--yellow:#f59e0b;--bg:#f2f5f8;--text:#1a1a1a;--muted:#8a919c;--border:#e6eaef;--card:#ffffff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; font-size: 16px; background: var(--bg); color: var(--text); }

#app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); }
#main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }

.page { display: none; min-height: 100%; flex-direction: column; }
.page.active { display: flex; }
.view-content { flex: 1; }

.tabbar { height: 60px; background: #fff; border-top: 1px solid var(--border); display: flex; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); border: none; background: none; font-weight: 600; cursor: pointer; }
.tab-item.active { color: var(--blue); }
.tab-icon { font-size: 20px; margin-bottom: 2px; }

.topbar{background:linear-gradient(135deg,var(--blue),#4fc3f7);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;flex-shrink:0; padding-top: calc(16px + env(safe-area-inset-top));}
.topbar .btn-back{border:none;background:transparent;color:#fff;font-size:15px;cursor:pointer;padding:5px;}
.topbar .title{font-size:17px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.fav-btn{border:none;background:transparent;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
.fav-btn.active{color:#fbbf24;}
.mode-btn{border:none;cursor:pointer;background:#fff;color:var(--blue);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.mode-btn.recite{background:#fff7ed;color:#f97316;}

/* 同步状态栏 */
.sync-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #e8f6fd; font-size: 13px; color: #0087c4; border-bottom: 1px solid #d0e8f7; }
.sync-bar.offline { background: #fef2f2; color: #ef4444; border-bottom: 1px solid #fecaca; }
.sync-btn { background: #00A0E9; color: #fff; border: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; }
.sync-bar.offline .sync-btn { background: #ef4444; }

.hero{padding:30px 20px 20px;text-align:center;background:linear-gradient(180deg,var(--blue) 0%,var(--bg) 100%);color:#fff;}
.hero h1{margin:0 0 10px;font-size:24px;}
.section-title{padding:15px 20px 5px;font-size:14px;font-weight:700;color:var(--muted);}
.card-list{padding:10px 20px 40px;display:flex;flex-direction:column;gap:12px;}
.menu-card{background:var(--card);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;}
.menu-card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.menu-card .info{flex:1;}
.menu-card .info h3{margin:0 0 4px;font-size:16px;}
.menu-card .info p{margin:0;font-size:12px;color:var(--muted);}

.progress-wrap{background:#fff;padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.progress-bar{flex:1;height:4px;background:#eef2f6;border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#4fc3f7);transition:width .3s;}
.timer{font-size:14px;font-weight:bold;color:var(--red);font-family:monospace;}
.question-area{padding:20px 18px;flex:1;}
.q-badge{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:12px;}
.q-text{font-size:17px;font-weight:500;line-height:1.7;margin:0 0 20px; white-space: pre-wrap;}
.options{display:flex;flex-direction:column;gap:12px;}

.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;}
.opt .letter{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt.selected{border-color:var(--blue);background:var(--blue-soft);}
.opt.selected .letter{background:var(--blue);color:#fff;}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);}
.opt.correct .letter{background:var(--green);color:#fff;}
.opt.incorrect{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.opt.incorrect .letter{background:var(--red);color:#fff;}
.opt.reveal-correct{border-color:var(--green);background:var(--green-soft);}
.opt.reveal-correct .letter{background:var(--green);color:#fff;}
.opt.disabled{pointer-events:none;}

.subj-btn{width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:bold; margin-bottom:10px; cursor:pointer;}
.subj-btn-view{background:var(--blue); color:#fff;}
.subj-btn-right{background:var(--green); color:#fff;}
.subj-btn-wrong{background:var(--red); color:#fff;}

.explain-box{display:none;margin-top:20px;background:#fff;border-radius:14px;padding:16px;border:1px solid var(--border);}
.explain-box.show{display:block;}
.explain-box strong{color:var(--blue);display:block;margin-bottom:6px;font-size:13px;}
.result-banner{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:12px;}
.result-banner.ok{background:var(--green-soft);color:var(--green);}
.result-banner.no{background:var(--red-soft);color:var(--red);}
.remove-tip{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;display:none;}
.bottom-bar{padding:16px 18px;background:#fff;border-top:1px solid var(--border);display:flex;gap:12px; padding-bottom: calc(16px + env(safe-area-inset-bottom));}
.btn-nav{flex:1;border:none;font-size:16px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;}
.btn-nav.prev{background:var(--bg);color:var(--muted);}
.btn-nav.next{background:var(--blue);color:#fff;}
.btn-nav.submit{background:var(--red);color:#fff;}
.btn-nav:disabled{opacity:.5;pointer-events:none;}

.import-area{padding: 20px; padding-bottom: 40px;}
.import-textarea{width:100%; height:160px; padding:15px; border:1px solid var(--border); border-radius:12px; font-family:monospace; font-size:14px; resize:none; outline:none; margin-bottom:15px;}
.import-btn{width:100%; background:var(--blue); color:#fff; border:none; padding:14px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; margin-bottom:10px;}
.import-btn-upload{background:#fff; color:var(--blue); border:2px solid var(--blue);}

.setting-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
.setting-item label { font-weight: bold; color: var(--text); font-size: 15px;}
.input-box { width: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; color: var(--blue); outline: none; }

.accordion{background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid var(--border);}
.accordion-header{padding:16px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer;}
.accordion-content{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .3s ease;background:#fafafa;font-size:14px;}
.accordion.open .accordion-content{max-height:800px;padding:16px;border-top:1px solid var(--border);}
</style>
</head>
<body>

<div id="app">
  <div id="main-content">
    <!-- 首页 -->
    <div id="page-home" class="page active">
      <div class="hero"><h1>技能高考备考</h1><p>云端同步 · 全科题库</p></div>
      
      <!-- 实时同步状态栏 -->
      <div id="sync-status" class="sync-bar">
        <span id="sync-text">☁️ 正在同步云端题库...</span>
        <button class="sync-btn" onclick="manualSync()">立即刷新</button>
      </div>

      <div id="home-content">
        <div class="section-title">科目练习</div>
        <div class="card-list">
          <div class="menu-card" onclick="startSubject('chinese')"><div class="icon" style="background:#fef2f2;color:#ef4444;">📕</div><div class="info"><h3>语文</h3><p id="count-chinese">0 题</p></div></div>
          <div class="menu-card" onclick="startSubject('math')"><div class="icon" style="background:#e8f6fd;color:#00A0E9;">📘</div><div class="info"><h3>数学</h3><p id="count-math">0 题</p></div></div>
          <div class="menu-card" onclick="startSubject('english')"><div class="icon" style="background:#fffbeb;color:#f59e0b;">📙</div><div class="info"><h3>英语</h3><p id="count-english">0 题</p></div></div>
          <div class="menu-card" onclick="startSubject('computer')"><div class="icon" style="background:#f3e8ff;color:#a855f7;">💻</div><div class="info"><h3>计算机</h3><p id="count-computer">0 题</p></div></div>
        </div>
        <div class="section-title">全真模拟</div>
        <div class="card-list">
          <div class="menu-card" onclick="startExam()" style="border: 2px solid var(--blue);"><div class="icon" style="background:var(--blue);color:#fff;">📝</div><div class="info"><h3 style="color:var(--blue);">自定义模拟考</h3><p id="exam-config-desc">加载中...</p></div></div>
        </div>
      </div>
    </div>

    <!-- 背诵 -->
    <div id="page-study" class="page">
      <div class="topbar" style="justify-content:center"><span class="title">知识点背诵</span></div>
      <div class="view-content">
        <div class="section-title">语文古诗文</div><div class="card-list" id="study-chinese"></div>
        <div class="section-title">数学公式</div><div class="card-list" id="study-math"></div>
        <div class="section-title">英语语法</div><div class="card-list" id="study-english"></div>
      </div>
    </div>

    <!-- 我的 -->
    <div id="page-profile" class="page">
      <div class="topbar" style="justify-content:center"><span class="title">我的与工具</span></div>
      <div class="view-content">
        <div class="card-list" style="margin-top:20px;">
          <div class="menu-card" onclick="showSubPage('view-import')" style="border:2px solid var(--blue);">
            <div class="icon" style="background:var(--blue-soft);color:var(--blue);">📥</div><div class="info"><h3 style="color:var(--blue);">后台批量导入</h3><p>一键存入云端，所有人可见</p></div>
          </div>
          <div class="menu-card" onclick="showSubPage('view-settings')">
            <div class="icon" style="background:#e0f2fe;color:#0284c7;">⚙️</div><div class="info"><h3>模拟考设置</h3><p>自定义时间及各科题量</p></div>
          </div>
          <div class="menu-card" onclick="startWrongPractice()"><div class="icon" style="background:#fee2e2;color:#ef4444;">❌</div><div class="info"><h3>错题本</h3><p id="wrongCountText">收集错题</p></div></div>
          <div class="menu-card" onclick="startFavPractice()"><div class="icon" style="background:#fef3c7;color:#d97706;">⭐</div><div class="info"><h3>我的收藏</h3><p id="favCountText">收藏题目</p></div></div>
        </div>
      </div>
    </div>

    <!-- 子页面：设置 -->
    <div id="view-settings" class="page">
      <div class="topbar"><button class="btn-back" onclick="backToProfile()">← 返回</button><span class="title">模拟考设置</span><span></span></div>
      <div class="import-area">
        <div class="setting-item"><label>考试时间 (分钟)</label><input type="number" id="set-time" class="input-box" value="5" min="1"></div>
        <div class="setting-item"><label>语文 题数</label><input type="number" id="set-chinese" class="input-box" value="8" min="0"></div>
        <div class="setting-item"><label>数学 题数</label><input type="number" id="set-math" class="input-box" value="8" min="0"></div>
        <div class="setting-item"><label>英语 题数</label><input type="number" id="set-english" class="input-box" value="4" min="0"></div>
        <button class="import-btn" onclick="saveSettings()">保存设置</button>
      </div>
    </div>

    <!-- 子页面：导入 -->
    <div id="view-import" class="page">
      <div class="topbar"><button class="btn-back" onclick="backToProfile()">← 返回</button><span class="title">后台云端导入</span><span></span></div>
      <div class="import-area">
        <p style="font-size:13px; color:var(--muted); margin-top:0;">在这里导入的题目，只要有网，所有人刷新网页都能看到。</p>
        <input type="file" id="fileInput" accept=".txt" style="display:none;" onchange="handleFileSelect(event)">
        <button class="import-btn import-btn-upload" onclick="document.getElementById('fileInput').click()">📂 选择 TXT 文件读取</button>
        <textarea id="importText" class="import-textarea" placeholder="在此粘贴题目文本..."></textarea>
        <button class="import-btn" id="btnImportExam" onclick="runImport('exam')">☁️ 解析并上传至云端</button>
        <button class="import-btn" style="background:#f59e0b;color:#fff;" onclick="runImport('study')">📖 解析为背诵卡片</button>
      </div>
    </div>

    <!-- 子页面：做题 -->
    <div id="view-question" class="page" style="background:var(--bg)">
      <div class="topbar">
        <button class="btn-back" onclick="backToProfile()">← 返回</button>
        <span class="title" id="pageTitle">练习</span>
        <div class="topbar-right">
          <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
          <button class="mode-btn" id="modeBtn" onclick="toggleRecite()">背题</button>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="timer" id="timerText" style="display:none;">05:00</div></div>
      <div class="question-area">
        <span class="q-badge" id="qTypeBadge">单选题 <span id="qIndexText"></span></span>
        <p class="q-text" id="qText"></p>
        <div class="options" id="optionsBox"></div>
        <div class="explain-box" id="explainBox">
          <div class="result-banner" id="resultBanner"></div>
          <strong>解析</strong><span id="explainText"></span>
          <div class="remove-tip" id="removeTip">🎉 答对啦！该题已从错题本移除。</div>
        </div>
      </div>
      <div class="bottom-bar">
        <button class="btn-nav prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
        <button class="btn-nav next" id="nextBtn" onclick="nextQuestion()">下一题</button>
        <button class="btn-nav submit" id="submitBtn" style="display:none;" onclick="submitExam()">交卷</button>
      </div>
    </div>

  </div>

  <div class="tabbar">
    <button class="tab-item active" onclick="switchTab('home')" id="tab-home"><span class="tab-icon">🏠</span>首页</button>
    <button class="tab-item" onclick="switchTab('study')" id="tab-study"><span class="tab-icon">📖</span>背诵</button>
    <button class="tab-item" onclick="switchTab('profile')" id="tab-profile"><span class="tab-icon">👤</span>我的</button>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://qguzbgsucrktalfugprb.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndXpiZ3N1Y3JrdGFsZnVncHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjUwOTUsImV4cCI6MjEwODk0MTA5NX0.NIv5V9Bx2h67fIckFJ6szTbROiyyBvbALI-OGqTBVPU';
var supabaseClient;
try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

var BANK = { chinese: [], math: [], english: [], computer: [] };
var STUDY = { chinese: [], math: [], english: [], computer: [] };
var wrongBook = [], favBook = [];
var examConfig = { timeLimit: 5, chineseCount: 8, mathCount: 8, englishCount: 4 };

try {
  var sw = localStorage.getItem("xzt_wrong_book"); if(sw) wrongBook = JSON.parse(sw);
  var sf = localStorage.getItem("xzt_fav_book"); if(sf) favBook = JSON.parse(sf);
  var ec = localStorage.getItem("xzt_exam_config"); if(ec) examConfig = JSON.parse(ec);
  var us = localStorage.getItem("xzt_user_study"); if(us) { var ps = JSON.parse(us); for(var k in ps) STUDY[k] = STUDY[k].concat(ps[k]); }
} catch(e){}

// 核心：从云端拉取最新题库
function loadCloudData() {
  if(!supabaseClient) { setSyncStatus(false); return; }
  
  var syncBar = document.getElementById('sync-status');
  var syncText = document.getElementById('sync-text');
  syncBar.className = "sync-bar";
  syncText.innerText = "☁️ 正在同步最新题库...";

  var timeout = new Promise(function(resolve, reject) { setTimeout(function() { reject(new Error("超时")); }, 8000); });
  var fetchData = supabaseClient.from('questions').select('*').then(function(res) {
    if (res.error) throw res.error;
    return res.data;
  });

  Promise.race([fetchData, timeout]).then(function(data) {
    // 清空内存中的云端题库（保留用户自己本地导入的）
    var ub = localStorage.getItem("xzt_user_bank");
    BANK = { chinese: [], math: [], english: [], computer: [] };
    if(ub) {
      var pb = JSON.parse(ub);
      for(var k in pb) BANK[k] = BANK[k].concat(pb[k]);
    }

    // 将最新云端数据放进去
    for(var i=0; i<data.length; i++) {
      var item = data[i];
      if(BANK[item.subject]) BANK[item.subject].push(item);
    }
    
    setSyncStatus(true);
    updateCounts(); updateHomeStats(); updateExamConfigDesc();
  }).catch(function(error) {
    setSyncStatus(false);
    updateCounts(); updateHomeStats(); updateExamConfigDesc();
  });
}

function setSyncStatus(isSuccess) {
  var syncBar = document.getElementById('sync-status');
  var syncText = document.getElementById('sync-text');
  if(isSuccess) {
    syncBar.className = "sync-bar";
    syncText.innerText = "✅ 云端数据已是最新";
  } else {
    syncBar.className = "sync-bar offline";
    syncText.innerText = "⚠️ 网络不佳，当前使用离线题库";
  }
}

function manualSync() {
  loadCloudData();
}

function updateExamConfigDesc() {
  var desc = document.getElementById("exam-config-desc");
  if (desc) desc.innerText = examConfig.timeLimit + "分钟 | 语:" + examConfig.chineseCount + " 数:" + examConfig.mathCount + " 英:" + examConfig.englishCount;
}
function saveSettings() {
  var t = parseInt(document.getElementById('set-time').value); var c = parseInt(document.getElementById('set-chinese').value); var m = parseInt(document.getElementById('set-math').value); var e = parseInt(document.getElementById('set-english').value);
  if (isNaN(t) || t <= 0 || isNaN(c) || c < 0 || isNaN(m) || m < 0 || isNaN(e) || e < 0) return alert("请输入有效数字");
  examConfig = { timeLimit: t, chineseCount: c, mathCount: m, englishCount: e };
  try { localStorage.setItem("xzt_exam_config", JSON.stringify(examConfig)); } catch(e){}
  updateExamConfigDesc(); alert("设置已保存！"); backToProfile();
}
function updateCounts() {
  document.getElementById('count-chinese').innerText = BANK.chinese.length + " 题"; document.getElementById('count-math').innerText = BANK.math.length + " 题"; document.getElementById('count-english').innerText = BANK.english.length + " 题"; document.getElementById('count-computer').innerText = BANK.computer.length + " 题";
}
function updateHomeStats() {
  var wTxt = document.getElementById('wrongCountText'); if(wTxt) { wTxt.innerText = wrongBook.length > 0 ? "共 " + wrongBook.length + " 道错题" : "暂无错题"; wTxt.style.color = wrongBook.length > 0 ? "var(--red)" : "var(--muted)"; }
  var fTxt = document.getElementById('favCountText'); if(fTxt) { fTxt.innerText = favBook.length > 0 ? "已收藏 " + favBook.length + " 道题" : "暂无收藏"; fTxt.style.color = favBook.length > 0 ? "var(--yellow)" : "var(--muted)"; }
}
function saveData() { try { localStorage.setItem("xzt_wrong_book", JSON.stringify(wrongBook)); localStorage.setItem("xzt_fav_book", JSON.stringify(favBook)); } catch(e){} updateHomeStats(); }
function addToWrong(id) { if(wrongBook.indexOf(id) === -1) { wrongBook.push(id); saveData(); } }
function removeFromWrong(id) { var i = wrongBook.indexOf(id); if(i > -1) { wrongBook.splice(i, 1); saveData(); } }
function toggleFav() { var q = currentQuestions[appMode === 'exam' ? examIndex : practiceIndex]; if(!q) return; var idx = favBook.indexOf(q.id); if(idx > -1) favBook.splice(idx, 1); else favBook.push(q.id); saveData(); renderQuestion(); }

function detectSubject(text) {
  var t = text.toLowerCase();
  if (t.match(/english|the |he |she |is |are |was |were|时态|语态/)) return 'english';
  if (t.match(/作者|诗句|字音|错别字|成语|语病|修辞|阅读|文言文|现代文|《|》/)) return 'chinese';
  if (t.match(/计算机|网络|ip|mac|协议|内存|cpu/)) return 'computer';
  return 'math';
}
function handleFileSelect(event) {
  var file = event.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) { document.getElementById("importText").value = e.target.result; alert("文件读取成功！"); };
  reader.readAsText(file, 'UTF-8'); event.target.value = "";
}
function runImport(type) {
  var raw = document.getElementById("importText").value.trim(); if(!raw) return alert("请先输入文本！");
  
  if (type === 'exam') {
    var btn = document.getElementById('btnImportExam');
    btn.innerText = "☁️ 正在上传至云端，请稍候..."; btn.disabled = true;

    var blocks = raw.replace(/\r\n/g, '\n').split(/\n(?=\s*\d+[\.\、\s])/);
    var parsed = { chinese: [], math: [], english: [], computer: [] };
    var choiceCnt = 0, textCnt = 0;
    
    blocks.forEach(function(block) {
      block = block.trim(); if(!block) return;
      var ansMatch = block.match(/答案[：:\s]*([\s\S]*?)(?=(?:\n\s*\d+[\.\、\s])|$)/); if(!ansMatch) return; 
      var answer = ansMatch[1].trim();
      var expMatch = block.match(/解析[：:\s]*([\s\S]*?)(?=(?:\n\s*\d+[\.\、\s])|$)/);
      var explain = expMatch ? expMatch[1].trim() : "暂无解析";
      var optRegex = /(?:^|\n)\s*([A-D])[\.\、\s]\s*(.*?)(?=\n\s*[A-D][\.\、\s]|\n\s*答案|$)/g;
      var options = [], match;
      while ((match = optRegex.exec(block)) !== null) { options.push(match[2].replace(/\n/g, '').trim()); }
      var qText = block.split(/(?:^|\n)\s*[A-D][\.\、\s]/)[0].split(/(?:^|\n)\s*答案/)[0].replace(/^\s*\d+[\.\、\s]*/, '').trim(); 
      var sub = detectSubject(qText);
      
      if(options.length >= 2 && /^[A-Da-d]$/.test(answer)) {
        choiceCnt++;
        parsed[sub].push({ subject: sub, type:'choice', q: qText, options: options, answer: answer.toUpperCase(), explain: explain });
      } else if (qText.length > 0 && answer.length > 0) {
        textCnt++;
        parsed[sub].push({ subject: sub, type:'text', q: qText, answer: answer, explain: explain });
      }
    });

    if(choiceCnt + textCnt === 0) {
      btn.innerText = "☁️ 解析并上传至云端"; btn.disabled = false;
      return alert("未识别到有效题目。请检查格式。");
    }

    if(!supabaseClient) {
       alert("⚠️ 云端组件未加载，无法上传。"); btn.innerText = "☁️ 解析并上传至云端"; btn.disabled = false; return;
    }

    var promises = [];
    for(var k in parsed) {
      if(parsed[k].length > 0) {
        promises.push(supabaseClient.from('questions').insert(parsed[k]));
      }
    }
    
    Promise.all(promises).then(function() {
      alert("✅ 成功上传 " + (choiceCnt + textCnt) + " 道题到云端！\n所有人都能刷新看到了！");
      document.getElementById("importText").value = "";
      backToProfile();
      loadCloudData(); // 上传成功后，自己先刷新一下
    }).catch(function(e) {
      alert("⚠️ 网络连接云端失败，上传未成功，请重试。");
    }).finally(function() {
      btn.innerText = "☁️ 解析并上传至云端"; btn.disabled = false;
    });

  } else {
    var blocks = raw.replace(/\r\n/g, '\n').split(/\n\s*\n/);
    var parsed = { chinese: [], math: [], english: [], computer: [] };
    blocks.forEach(function(block) {
      block = block.trim(); if(!block) return;
      var lines = block.split('\n'); var title = lines[0].replace(/[#【】]/g, '').trim(); var content = lines.slice(1).join('\n').trim();
      if (!content && title.length > 20) { content = title; title = title.substring(0, 15) + "..."; }
      if(content) {
        var sub = detectSubject(title + content);
        parsed[sub].push({ title: title, content: content, note: "本地导入" });
      }
    });
    var userStudy = JSON.parse(localStorage.getItem("xzt_user_study") || "{}");
    for(var k in parsed) {
      if(parsed[k].length > 0) {
        STUDY[k] = STUDY[k].concat(parsed[k]);
        if(!userStudy[k]) userStudy[k] = [];
        userStudy[k] = userStudy[k].concat(parsed[k]);
      }
    }
    try { localStorage.setItem("xzt_user_study", JSON.stringify(userStudy)); } catch(e){}
    document.getElementById("importText").value = ""; alert("背诵资料导入成功！"); backToProfile();
  }
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-item').forEach(function(t){ t.classList.remove('active'); });
  
  if(tab === 'home') { document.getElementById('page-home').classList.add('active'); document.getElementById('tab-home').classList.add('active'); }
  if(tab === 'study') { renderStudy(); document.getElementById('page-study').classList.add('active'); document.getElementById('tab-study').classList.add('active'); }
  if(tab === 'profile') { document.getElementById('page-profile').classList.add('active'); document.getElementById('tab-profile').classList.add('active'); }
  document.getElementById('main-content').scrollTop = 0;
}

function showSubPage(id) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.getElementById('main-content').scrollTop = 0;
}
function backToProfile() {
  clearInterval(examTimer);
  showSubPage('page-profile');
}

function renderStudy() {
  function buildHtml(list) {
    var html = ""; if(!list || list.length === 0) return '<div style="font-size:12px;color:#999;padding:10px;">暂无资料</div>';
    for(var i=0; i<list.length; i++) html += '<div class="accordion"><div class="accordion-header" onclick="toggleAcc(this)">' + list[i].title + ' <span>▼</span></div><div class="accordion-content">' + list[i].content.replace(/\n/g, '<br>') + '</div></div>';
    return html;
  }
  document.getElementById('study-chinese').innerHTML = buildHtml(STUDY.chinese); document.getElementById('study-math').innerHTML = buildHtml(STUDY.math); document.getElementById('study-english').innerHTML = buildHtml(STUDY.english);
}
function toggleAcc(header) { header.parentElement.classList.toggle('open'); var span = header.querySelector('span'); if(span) span.innerText = header.parentElement.classList.contains('open') ? '▲' : '▼'; }

function initPractice() {
  practiceIndex = 0; practiceAnswers = new Array(currentQuestions.length).fill(null); isReciteMode = false;
  document.getElementById('modeBtn').style.display = "block"; document.getElementById('modeBtn').innerText = "背题"; document.getElementById('modeBtn').classList.remove('recite');
  document.getElementById('timerText').style.display = "none"; document.getElementById('submitBtn').style.display = "none"; document.getElementById('nextBtn').style.display = "block";
  showSubPage('view-question'); renderQuestion();
}
function startSubject(subject) {
  appMode = 'practice'; var titles = { chinese: "语文练习", math: "数学练习", english: "英语练习", computer: "计算机练习" };
  document.getElementById('pageTitle').innerText = titles[subject]; currentQuestions = BANK[subject] || [];
  if(currentQuestions.length === 0) return alert("该科目暂无题目！"); initPractice();
}
function startWrongPractice() {
  if(wrongBook.length === 0) return alert("错题本还是空的！");
  appMode = 'wrong'; var allQ = []; for(var k in BANK) allQ = allQ.concat(BANK[k]); currentQuestions = allQ.filter(function(q) { return wrongBook.indexOf(q.id) > -1; });
  if(currentQuestions.length === 0) return alert("错题已失效"); document.getElementById('pageTitle').innerText = "错题重做"; initPractice();
}
function startFavPractice() {
  if(favBook.length === 0) return alert("还没有收藏题目！");
  appMode = 'fav'; var allQ = []; for(var k in BANK) allQ = allQ.concat(BANK[k]); currentQuestions = allQ.filter(function(q) { return favBook.indexOf(q.id) > -1; });
  if(currentQuestions.length === 0) return alert("收藏已失效"); document.getElementById('pageTitle').innerText = "我的收藏"; initPractice();
}
function startExam() {
  appMode = 'exam'; var cPool = (BANK.chinese || []).slice(); var mPool = (BANK.math || []).slice(); var ePool = (BANK.english || []).slice();
  function shuffle(a) { for(var i=a.length-1; i>0; i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  shuffle(cPool); shuffle(mPool); shuffle(ePool);
  var cTake = Math.min(cPool.length, examConfig.chineseCount); var mTake = Math.min(mPool.length, examConfig.mathCount); var eTake = Math.min(ePool.length, examConfig.englishCount);
  currentQuestions = shuffle(cPool.slice(0, cTake).concat(mPool.slice(0, mTake)).concat(ePool.slice(0, eTake)));
  if(currentQuestions.length === 0) return alert("题库为空，无法组卷！");
  examIndex = 0; examAnswers = new Array(currentQuestions.length).fill(null); timeLeft = examConfig.timeLimit * 60;
  document.getElementById('pageTitle').innerText = "全真模拟考"; document.getElementById('modeBtn').style.display = "none"; document.getElementById('timerText').style.display = "block"; document.getElementById('submitBtn').style.display = "block"; document.getElementById('nextBtn').style.display = "none";
  updateTimerDisplay(); clearInterval(examTimer);
  examTimer = setInterval(function() { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(examTimer); alert("考试时间到！自动交卷"); submitExam(); } }, 1000);
  showSubPage('view-question'); renderQuestion();
}
function toggleRecite() { isReciteMode = !isReciteMode; var btn = document.getElementById('modeBtn'); btn.innerText = isReciteMode ? "答题" : "背题"; if(isReciteMode) btn.classList.add('recite'); else btn.classList.remove('recite'); renderQuestion(); }
function updateTimerDisplay() { var m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timerText').innerText = (m<10?'0':'')+m + ":" + (s<10?'0':'')+s; }

function renderQuestion() {
  if(!currentQuestions || currentQuestions.length === 0) return;
  var isPractice = (appMode !== 'exam'); var q = currentQuestions[isPractice ? practiceIndex : examIndex]; if(!q) return;
  var idx = isPractice ? practiceIndex : examIndex, total = currentQuestions.length;
  document.getElementById('progressFill').style.width = ((idx + 1) / total * 100) + "%"; document.getElementById('qIndexText').innerText = " " + (idx + 1) + "/" + total;
  document.getElementById('qTypeBadge').innerHTML = (q.type === 'text' ? '主观题' : '单选题') + ' <span id="qIndexText">'+(idx + 1)+'/'+total+'</span>';
  document.getElementById('qText').innerText = q.q;
  var isFav = favBook.indexOf(q.id) > -1; var favBtn = document.getElementById('favBtn'); favBtn.innerText = isFav ? "★" : "☆"; if(isFav) favBtn.classList.add('active'); else favBtn.classList.remove('active');
  var optBox = document.getElementById('optionsBox'); optBox.innerHTML = ""; var currentAnswer = isPractice ? practiceAnswers[idx] : examAnswers[idx]; var hasAnswered = currentAnswer !== null;
  if (isPractice && isReciteMode) hasAnswered = true;
  if (q.type === 'choice') {
    if (isPractice && isReciteMode) currentAnswer = q.answer;
    for (var i = 0; i < q.options.length; i++) { (function(letter, text) {
        var btn = document.createElement("button"); btn.className = "opt"; btn.innerHTML = '<span class="letter">' + letter + '</span><span>' + text + '</span>';
        if (hasAnswered) {
          btn.classList.add('disabled');
          if (isPractice) {
            if (letter === currentAnswer && letter === q.answer) btn.className = "opt correct disabled";
            else if (letter === currentAnswer && letter !== q.answer) btn.className = "opt incorrect disabled";
            else if (letter !== currentAnswer && letter === q.answer) btn.className = "opt reveal-correct disabled";
            else btn.className = "opt disabled";
          } else { if (letter === currentAnswer) btn.classList.add('selected'); }
        } else { btn.onclick = function() { selectOption(letter); }; } optBox.appendChild(btn);
    })("ABCD".charAt(i), q.options[i]); }
  } else {
    if (hasAnswered || (isPractice && isReciteMode)) {
      var ansDiv = document.createElement('div'); ansDiv.className = "explain-box show"; ansDiv.innerHTML = '<strong>标准答案</strong><span style="color:var(--green); font-weight:bold;">' + q.answer + '</span>'; optBox.appendChild(ansDiv);
      if (isPractice && !isReciteMode) {
        var selfEval = document.createElement('div'); selfEval.innerHTML = '<div style="font-size:14px; margin-bottom:10px; color:var(--muted);">你答对了吗？</div><button class="subj-btn subj-btn-right" onclick="subjRate(true)">我答对了</button><button class="subj-btn subj-btn-wrong" onclick="subjRate(false)">我答错了，加入错题本</button>'; optBox.appendChild(selfEval);
      }
    } else {
      var viewBtn = document.createElement('button'); viewBtn.className = "subj-btn subj-btn-view"; viewBtn.innerText = "查看标准答案"; viewBtn.onclick = function() { hasAnswered = true; renderQuestion(); }; optBox.appendChild(viewBtn);
    }
  }
  var explainBox = document.getElementById('explainBox'), removeTip = document.getElementById('removeTip'); removeTip.style.display = "none";
  if (isPractice && hasAnswered && q.type === 'choice') {
    explainBox.classList.add('show'); var banner = document.getElementById('resultBanner');
    if (currentAnswer === q.answer) { banner.className = "result-banner ok"; banner.innerText = "✓ 回答正确"; if(appMode === 'wrong' && !isReciteMode) removeTip.style.display = "block"; }
    else { banner.className = "result-banner no"; banner.innerText = "✕ 回答错误，正确答案是 " + q.answer; }
    document.getElementById('explainText').innerText = q.explain || "暂无解析";
  } else if (q.type === 'text' && (hasAnswered || isReciteMode)) {
      explainBox.classList.add('show'); document.getElementById('resultBanner').className = "result-banner ok"; document.getElementById('resultBanner').innerText = "主观题解析"; document.getElementById('explainText').innerText = q.explain || "暂无解析";
  } else { explainBox.classList.remove('show'); }
  document.getElementById('prevBtn').disabled = (idx === 0);
  if (appMode === 'exam') { if (idx === total - 1) { document.getElementById('nextBtn').style.display = "none"; document.getElementById('submitBtn').style.display = "block"; } else { document.getElementById('nextBtn').style.display = "block"; document.getElementById('submitBtn').style.display = "none"; } }
}
function subjRate(isRight) { var idx = (appMode === 'exam') ? examIndex : practiceIndex; practiceAnswers[idx] = isRight ? "RIGHT" : "WRONG"; var q = currentQuestions[idx]; if (isRight) removeFromWrong(q.id); else addToWrong(q.id); renderQuestion(); }
function selectOption(letter) {
  var isPractice = (appMode !== 'exam');
  if (isPractice) {
    practiceAnswers[practiceIndex] = letter; var q = currentQuestions[practiceIndex];
    if (!isReciteMode) { if (letter !== q.answer) addToWrong(q.id); else if (appMode === 'wrong') removeFromWrong(q.id); }
  } else { examAnswers[examIndex] = letter; } renderQuestion();
}
function prevQuestion() { if (appMode === 'exam') { if (examIndex > 0) { examIndex--; renderQuestion(); } } else { if (practiceIndex > 0) { practiceIndex--; renderQuestion(); } } }
function nextQuestion() { if (appMode === 'exam') { if (examIndex < currentQuestions.length - 1) { examIndex++; renderQuestion(); } } else { if (practiceIndex < currentQuestions.length - 1) { practiceIndex++; renderQuestion(); } } }
function submitExam() {
  var unAnswered = 0; for (var i = 0; i < currentQuestions.length; i++) if (examAnswers[i] === null) unAnswered++;
  if (unAnswered > 0 && timeLeft > 0) { if(!confirm("还有 " + unAnswered + " 题未作答，确定交卷吗？")) return; }
  clearInterval(examTimer); var rightCount = 0;
  for (var i = 0; i < currentQuestions.length; i++) { if (examAnswers[i] === currentQuestions[i].answer) rightCount++; else addToWrong(currentQuestions[i].id); }
  var score = Math.round(rightCount / currentQuestions.length * 100); alert("交卷成功！\n得分：" + score + " 分\n答对：" + rightCount + " / " + currentQuestions.length + " 题"); backToProfile();
}

// 启动
loadCloudData();
</script>
